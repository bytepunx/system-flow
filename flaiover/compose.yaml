# Local run of flaiover with a telemetry stack. From the repository root:
#   docker compose -f flaiover/compose.yaml up --build
# The container holds nothing of the project (ADR-0031): it is given the login
# token's file, the one flai dashboard token --json names (file), by default
# beside flai serve's state at ~/.flai/serve; set DASHBOARD_TOKEN_FILE when
# flai runs with another config.
# Dashboard: http://localhost:4242   Grafana (traces, metrics, logs): http://localhost:3001
services:
  flaiover:
    build:
      context: ..
      dockerfile: flaiover/Dockerfile
    image: flaiover:local
    user: '${UID:-1000}:${GID:-1000}'
    ports:
      - '4242:3000' # every interface, like flai dashboard; prefix 127.0.0.1: to restrict
    volumes:
      - '${DASHBOARD_TOKEN_FILE:-${HOME}/.flai/serve/dashboard.token}:/run/secrets/flaiover_token:ro' # flai dashboard token creates it
    environment:
      FLAIOVER_TOKEN_FILE: /run/secrets/flaiover_token
      LOG_LEVEL: ${LOG_LEVEL:-info}
      OTEL_SERVICE_NAME: flaiover
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-always_on}
    depends_on:
      - lgtm
  lgtm:
    # OpenTelemetry collector, Tempo, Prometheus, Loki, and Grafana in one container for local use.
    image: grafana/otel-lgtm:latest
    ports:
      - '127.0.0.1:3001:3000'
      - '127.0.0.1:4317:4317'
      - '127.0.0.1:4318:4318'
    environment:
      ENABLE_LOGS_ALL: 'true'
