name: flaiover

on:
  pull_request:
    paths: ["flaiover/**", ".github/workflows/flaiover.yml"]
  push:
    branches: [main]
    paths: ["flaiover/**", ".github/workflows/flaiover.yml"]

defaults:
  run:
    working-directory: flaiover

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.34.5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: flaiover/.nvmrc
          cache: pnpm
          cache-dependency-path: flaiover/pnpm-lock.yaml
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: flai/go.mod
      - name: Build flai for the write and metrics tests
        run: go build -o "$RUNNER_TEMP/flai" .
        working-directory: flai
      - run: pnpm install --frozen-lockfile
      - name: Lint and format
        run: pnpm lint
      - name: Type check
        run: pnpm check
      - name: Unit tests
        run: pnpm test:unit
        env:
          FLAI_BIN: ${{ runner.temp }}/flai
      - name: Build
        run: pnpm build
