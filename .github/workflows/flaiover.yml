name: flaiover

on:
  pull_request:
    paths: ["flaiover/**", ".github/workflows/flaiover.yml"]
  push:
    branches: [main]
    paths: ["flaiover/**", ".github/workflows/flaiover.yml"]

defaults:
  run:
    working-directory: flaiover

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.34.5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: flaiover/.nvmrc
          cache: pnpm
          cache-dependency-path: flaiover/pnpm-lock.yaml
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: flai/go.mod
      - name: Build flai for the write and metrics tests
        run: go build -o "$RUNNER_TEMP/flai" .
        working-directory: flai
      - run: pnpm install --frozen-lockfile
      - name: Lint and format
        run: pnpm lint
      - name: Type check
        run: pnpm check
      - name: Unit tests
        run: pnpm test:unit
        env:
          FLAI_BIN: ${{ runner.temp }}/flai
      - name: Build
        run: pnpm build
