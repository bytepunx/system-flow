name: flaiover

on:
  pull_request:
    paths: ["flaiover/**", ".github/workflows/flaiover.yml"]
  push:
    branches: [main]
    paths: ["flaiover/**", ".github/workflows/flaiover.yml"]

defaults:
  run:
    working-directory: flaiover

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
      - uses: actions/setup-node@v6
        with:
          node-version-file: flaiover/.nvmrc
          cache: pnpm
          cache-dependency-path: flaiover/pnpm-lock.yaml
      - uses: actions/setup-go@v7
        with:
          go-version-file: flai/go.mod
      - name: Build flai for the write and metrics tests
        run: go build -o "$RUNNER_TEMP/flai" .
        working-directory: flai
      - run: pnpm install --frozen-lockfile
      - name: Lint and format
        run: pnpm lint
      - name: Type check
        run: pnpm check
      - name: Unit tests
        run: pnpm test:unit
        env:
          FLAI_BIN: ${{ runner.temp }}/flai
      - name: Build
        run: pnpm build
