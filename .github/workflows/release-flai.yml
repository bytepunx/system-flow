name: release flai

on:
  push:
    tags: ["flai/v*"]

permissions:
  contents: read

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    # contents: write publishes the GitHub release and its assets; id-token
    # and attestations are for the build provenance attestation.
    permissions:
      contents: write
      id-token: write
      attestations: write
    # The release key's secrets, COSIGN_PRIVATE_KEY and COSIGN_PASSWORD, live
    # in the environment `release`, which only flai/v* and flaiover/v* tags
    # may deploy to (docs/operators/runbooks/release-key.md).
    environment: release
    defaults:
      run:
        working-directory: flai
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: flai/go.mod
      # Pinned: the signs flags in .goreleaser.yaml are cosign v3's, and v4
      # removes two of them (design/system/release-signing.md). The installer
      # has no moving v4 tag.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      # An unsigned release is no release: fail before building when the key
      # or its password is missing.
      - name: Release key present
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          missing=0
          for name in COSIGN_PRIVATE_KEY COSIGN_PASSWORD; do
            if [ -z "$(printenv "$name")" ]; then
              echo "::error::secret $name is not set in the environment release; see docs/operators/runbooks/release-key.md"
              missing=1
            fi
          done
          exit "$missing"
      # The release stamp (S-0235): the release key signs the line
      # "flai <version> <commit>", no newline, and GoReleaser's ldflags write
      # the line and its signature into buildinfo, which flai verifies against
      # its own Version and Commit. Those come from .goreleaser.yaml, so this
      # line must be built the same way or every release warns about itself:
      # the version is the tag less flai/v, as trimprefix gives it, and the
      # commit is git show's %h, the command GoReleaser's git pipe takes
      # .ShortCommit from, in the same checkout. The files stay outside the
      # tree so that GoReleaser finds it clean.
      - name: Sign the release stamp
        id: stamp
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          version="${GITHUB_REF_NAME#flai/v}"
          commit="$(git show --format=%h --quiet HEAD)"
          printf '%s' "flai $version $commit" >"$RUNNER_TEMP/stamp.txt"
          cosign sign-blob --key env://COSIGN_PRIVATE_KEY \
            --use-signing-config=false --new-bundle-format=false \
            --tlog-upload=false --output-signature "$RUNNER_TEMP/stamp.sig" \
            --yes "$RUNNER_TEMP/stamp.txt"
          echo "statement=$(cat "$RUNNER_TEMP/stamp.txt")" >>"$GITHUB_OUTPUT"
          echo "signature=$(tr -d '\n' <"$RUNNER_TEMP/stamp.sig")" >>"$GITHUB_OUTPUT"
      # The monorepo tags flai/vX.Y.Z. GoReleaser OSS cannot strip the
      # prefix, so .goreleaser.yaml derives the version from the tag with
      # trimprefix and validation of the tag as semver is skipped here.
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.18.1
          workdir: flai
          args: release --clean --skip=validate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          FLAI_RELEASE_STATEMENT: ${{ steps.stamp.outputs.statement }}
          FLAI_RELEASE_SIGNATURE: ${{ steps.stamp.outputs.signature }}
      # A keyless provenance statement for anyone with gh. Artifact
      # attestations are available only to public repositories on the Team
      # plan (design/system/release-signing.md), so the step is skipped while
      # bytepunx/system-flow is private. subject-checksums cannot be given
      # with subject-path, so the paths are listed; uses: inputs are relative
      # to the repository root, not to flai/.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: ${{ !github.event.repository.private }}
        with:
          subject-path: |
            flai/dist/*.tar.gz
            flai/dist/*.zip
            flai/dist/checksums.txt

  # The agent images of this release (ADR-0295): flai-agent-bedrock from
  # bedrock's prebuilt target with the release's own flai and pilot for Linux,
  # then flai-agent-claude-code over it by its index digest, for linux/amd64
  # and linux/arm64, pushed to GHCR tagged with the version. No secret here:
  # the release key signs them in agent-images-release.
  agent-images:
    needs: goreleaser
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      bedrock: ${{ steps.bedrock.outputs.digest }}
      claude-code: ${{ steps.claude-code.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The commit as the goreleaser job's stamp computes it, git show's %h in
      # a full clone, so the label names the commit the binaries report.
      - name: Version and commit
        id: version
        run: |
          {
            echo "version=${GITHUB_REF_NAME#flai/v}"
            echo "commit=$(git show --format=%h --quiet HEAD)"
          } >> "$GITHUB_OUTPUT"
      # The images hold the binaries the release published, not a build of
      # their own: each archive is checked against checksums.txt and
      # checksums.txt against its signature by the key flai embeds, with
      # openssl, as install.sh checks them. The context holds
      # linux-<arch>/flai and linux-<arch>/pilot, as the prebuilt target reads.
      - name: The release's flai and pilot for Linux
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/release" agent-context
          cd "$RUNNER_TEMP/release"
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --pattern checksums.txt --pattern checksums.txt.sig \
            --pattern "flai_${VERSION}_linux_*.tar.gz" --pattern "pilot_${VERSION}_linux_*.tar.gz"
          openssl base64 -d -A -in checksums.txt.sig -out checksums.txt.der
          openssl dgst -sha256 -verify "$GITHUB_WORKSPACE/flai/internal/buildinfo/cosign.pub" \
            -signature checksums.txt.der checksums.txt
          for arch in amd64 arm64; do
            for bin in flai pilot; do
              archive="${bin}_${VERSION}_linux_${arch}.tar.gz"
              grep -q "  ${archive}\$" checksums.txt || { echo "::error::checksums.txt does not name $archive"; exit 1; }
            done
          done
          sha256sum --check --ignore-missing --strict checksums.txt
          for arch in amd64 arm64; do
            dir="$GITHUB_WORKSPACE/agent-context/linux-$arch"
            mkdir -p "$dir"
            tar -xzf "flai_${VERSION}_linux_${arch}.tar.gz" -C "$dir" flai
            tar -xzf "pilot_${VERSION}_linux_${arch}.tar.gz" -C "$dir" pilot
          done
          "$GITHUB_WORKSPACE/agent-context/linux-amd64/flai" version
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Its digest output is the image index's, since two platforms are
      # pushed: what the digest list's index line, cosign, the attestation,
      # and the claude-code build's BASE name.
      - name: Build and push flai-agent-bedrock
        id: bedrock
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: agent-context
          file: flai/images/bedrock/Dockerfile
          target: prebuilt
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/bytepunx/flai-agent-bedrock:${{ steps.version.outputs.version }}
          build-args: |
            FLAI_VERSION=${{ steps.version.outputs.version }}
            FLAI_COMMIT=${{ steps.version.outputs.commit }}
          cache-from: type=gha,scope=flai-agent-bedrock
          cache-to: type=gha,mode=max,scope=flai-agent-bedrock
      # Over bedrock by its index digest, so the base is pinned; its Dockerfile
      # copies nothing, so its own folder is the whole context.
      - name: Build and push flai-agent-claude-code
        id: claude-code
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: flai/images/claude-code
          file: flai/images/claude-code/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/bytepunx/flai-agent-claude-code:${{ steps.version.outputs.version }}
          build-args: |
            BASE=ghcr.io/bytepunx/flai-agent-bedrock@${{ steps.bedrock.outputs.digest }}
          cache-from: type=gha,scope=flai-agent-claude-code
          cache-to: type=gha,mode=max,scope=flai-agent-claude-code
      # Each platform of each image must carry the labels that tie it to this
      # release's flai (ADR-0295), or the list would name images flai judges
      # stale.
      - name: The images carry their flai's version and commit
        env:
          VERSION: ${{ steps.version.outputs.version }}
          COMMIT: ${{ steps.version.outputs.commit }}
          BEDROCK: ghcr.io/bytepunx/flai-agent-bedrock@${{ steps.bedrock.outputs.digest }}
          CLAUDE_CODE: ghcr.io/bytepunx/flai-agent-claude-code@${{ steps.claude-code.outputs.digest }}
        run: |
          for ref in "$BEDROCK" "$CLAUDE_CODE"; do
            labels=$(docker buildx imagetools inspect "$ref" --format '{{json .Image}}' |
              jq -r 'if has("config") then [.] else [.[]] end | .[] | .config.Labels
                | "\(.["dev.system-flow.flai"] // "") \(.["dev.system-flow.commit"] // "")"' | sort -u)
            if [ "$labels" != "$VERSION $COMMIT" ]; then
              echo "::error::$ref carries the labels '$labels', not '$VERSION $COMMIT'"
              exit 1
            fi
          done

  # Signs and lists what agent-images pushed, in the environment that holds
  # the release key: one digest list per image, written by
  # scripts/agent-image-digests.sh in flaiover's format and signed as
  # checksums.txt is; each image signed with cosign by its index digest and
  # attested when the repository is public, as the flaiover image is
  # (design/system/release-signing.md); the lists and their signatures added
  # to the release flai vX.Y.Z.
  agent-images-release:
    needs: agent-images
    runs-on: ubuntu-latest
    environment: release
    # contents to add the lists to the release; packages for cosign's
    # signatures and the attestations pushed to GHCR; id-token, attestations,
    # and artifact-metadata for the attestations, as actions/attest documents.
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      VERSION: ${{ needs.agent-images.outputs.version }}
      BEDROCK: ghcr.io/bytepunx/flai-agent-bedrock
      BEDROCK_DIGEST: ${{ needs.agent-images.outputs.bedrock }}
      CLAUDE_CODE: ghcr.io/bytepunx/flai-agent-claude-code
      CLAUDE_CODE_DIGEST: ${{ needs.agent-images.outputs.claude-code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pinned: the sign flags below are cosign v3's, and v4 removes two of
      # them (design/system/release-signing.md). The installer has no moving
      # v4 tag.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # For docker buildx imagetools, which the list script reads the indexes with.
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Digest lists
        run: |
          mkdir -p agent-digests
          scripts/agent-image-digests.sh "$VERSION" "$BEDROCK_DIGEST" "$CLAUDE_CODE_DIGEST" agent-digests
          cat agent-digests/*.digests
      # As flai's checksums.txt is signed (flai/.goreleaser.yaml): a key pair
      # from the environment, no Rekor entry, one base64 signature in a file
      # of its own. The three flags keep that in cosign v3.
      - name: Sign the digest lists
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          for list in agent-digests/*.digests; do
            cosign sign-blob --key env://COSIGN_PRIVATE_KEY \
              --use-signing-config=false --new-bundle-format=false --tlog-upload=false \
              --output-signature "$list.sig" --yes "$list"
          done
      # The same key and flags on each image, by its index digest and not each
      # platform's (no --recursive), as release-flaiover.yml signs flaiover's.
      # Anyone verifies with:
      #   cosign verify --key cosign.pub --insecure-ignore-tlog=true ghcr.io/bytepunx/flai-agent-bedrock@sha256:…
      - name: Sign the images
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          for ref in "$BEDROCK@$BEDROCK_DIGEST" "$CLAUDE_CODE@$CLAUDE_CODE_DIGEST"; do
            cosign sign --key env://COSIGN_PRIVATE_KEY \
              --use-signing-config=false --new-bundle-format=false --tlog-upload=false \
              --yes "$ref"
          done
      # Keyless provenance for anyone with gh, pushed to GHCR beside each
      # image. Artifact attestations are available only to public repositories
      # on the Team plan (design/system/release-signing.md), so both steps are
      # skipped while bytepunx/system-flow is private.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: ${{ !github.event.repository.private }}
        with:
          subject-name: ${{ env.BEDROCK }}
          subject-digest: ${{ env.BEDROCK_DIGEST }}
          push-to-registry: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: ${{ !github.event.repository.private }}
        with:
          subject-name: ${{ env.CLAUDE_CODE }}
          subject-digest: ${{ env.CLAUDE_CODE_DIGEST }}
          push-to-registry: true
      # Beside checksums.txt on the release GoReleaser published; --clobber so
      # that a rerun of this job replaces what a failed one left.
      - name: Add the lists to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber \
            agent-digests/*.digests agent-digests/*.digests.sig
