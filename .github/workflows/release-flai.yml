name: release flai

on:
  push:
    tags: ["flai/v*"]

# id-token and attestations are for the build provenance attestation.
permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    # The release key's secrets, COSIGN_PRIVATE_KEY and COSIGN_PASSWORD, live
    # in the environment `release`, which only flai/v* and flaiover/v* tags
    # may deploy to (docs/operators/runbooks/release-key.md).
    environment: release
    defaults:
      run:
        working-directory: flai
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: flai/go.mod
      # Pinned: the signs flags in .goreleaser.yaml are cosign v3's, and v4
      # removes two of them (design/system/release-signing.md). The installer
      # has no moving v4 tag.
      - uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: v3.1.3
      # An unsigned release is no release: fail before building when the key
      # or its password is missing.
      - name: Release key present
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          missing=0
          for name in COSIGN_PRIVATE_KEY COSIGN_PASSWORD; do
            if [ -z "$(printenv "$name")" ]; then
              echo "::error::secret $name is not set in the environment release; see docs/operators/runbooks/release-key.md"
              missing=1
            fi
          done
          exit "$missing"
      # The release stamp (S-0235): the release key signs the line
      # "flai <version> <commit>", no newline, and GoReleaser's ldflags write
      # the line and its signature into buildinfo, which flai verifies against
      # its own Version and Commit. Those come from .goreleaser.yaml, so this
      # line must be built the same way or every release warns about itself:
      # the version is the tag less flai/v, as trimprefix gives it, and the
      # commit is git show's %h, the command GoReleaser's git pipe takes
      # .ShortCommit from, in the same checkout. The files stay outside the
      # tree so that GoReleaser finds it clean.
      - name: Sign the release stamp
        id: stamp
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          version="${GITHUB_REF_NAME#flai/v}"
          commit="$(git show --format=%h --quiet HEAD)"
          printf '%s' "flai $version $commit" >"$RUNNER_TEMP/stamp.txt"
          cosign sign-blob --key env://COSIGN_PRIVATE_KEY \
            --use-signing-config=false --new-bundle-format=false \
            --tlog-upload=false --output-signature "$RUNNER_TEMP/stamp.sig" \
            --yes "$RUNNER_TEMP/stamp.txt"
          echo "statement=$(cat "$RUNNER_TEMP/stamp.txt")" >>"$GITHUB_OUTPUT"
          echo "signature=$(tr -d '\n' <"$RUNNER_TEMP/stamp.sig")" >>"$GITHUB_OUTPUT"
      # The monorepo tags flai/vX.Y.Z. GoReleaser OSS cannot strip the
      # prefix, so .goreleaser.yaml derives the version from the tag with
      # trimprefix and validation of the tag as semver is skipped here.
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          workdir: flai
          args: release --clean --skip=validate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          FLAI_RELEASE_STATEMENT: ${{ steps.stamp.outputs.statement }}
          FLAI_RELEASE_SIGNATURE: ${{ steps.stamp.outputs.signature }}
      # A keyless provenance statement for anyone with gh. Artifact
      # attestations are available only to public repositories on the Team
      # plan (design/system/release-signing.md), so the step is skipped while
      # bytepunx/system-flow is private. subject-checksums cannot be given
      # with subject-path, so the paths are listed; uses: inputs are relative
      # to the repository root, not to flai/.
      - uses: actions/attest-build-provenance@v4
        if: ${{ !github.event.repository.private }}
        with:
          subject-path: |
            flai/dist/*.tar.gz
            flai/dist/*.zip
            flai/dist/checksums.txt
