name: flai

on:
  pull_request:
    paths: ["flai/**", ".github/workflows/flai.yml"]
  push:
    branches: [main]
    paths: ["flai/**", ".github/workflows/flai.yml"]

defaults:
  run:
    working-directory: flai

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: flai/go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.5.0
          install-mode: goinstall   # build with the workflow's Go; prebuilt binaries lag flai/go.mod
          working-directory: flai

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: flai/go.mod
      - name: Behavior tests
        run: go test -race -short -count=1 ./...
      - name: Integration tests
        run: go test -race -count=1 ./...

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: flai/go.mod
      - run: GOOS=${{ matrix.goos }} GOARCH=amd64 go build ./...
