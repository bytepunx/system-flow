name: flai

on:
  pull_request:
    paths: ["flai/**", ".github/workflows/flai.yml"]
  push:
    branches: [main]
    paths: ["flai/**", ".github/workflows/flai.yml"]

defaults:
  run:
    working-directory: flai

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: flai/go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.5.0
          install-mode: goinstall   # build with the workflow's Go; prebuilt binaries lag flai/go.mod
          working-directory: flai

  test:
    # macOS too, where the temp dir is a symlink, /bin/sh is bash, and git
    # works out an identity from the hostname (I-0045)
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            race: -race
          - os: macos-latest
            race: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: flai/go.mod
      # the race detector runs on ubuntu only: on the macos-26 image its
      # runtime crashes in forked children now and then (ThreadSanitizer
      # CHECK failed in tsan_rtl.cpp, or a segmentation fault in git)
      - name: Behavior tests
        run: go test ${{ matrix.race }} -short -count=1 -timeout 30m ./...
      - name: Integration tests
        run: go test ${{ matrix.race }} -count=1 -timeout 30m ./...

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: flai/go.mod
      - run: GOOS=${{ matrix.goos }} GOARCH=amd64 go build ./...
