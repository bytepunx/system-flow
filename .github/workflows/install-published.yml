name: install published release

# Installs the latest published flai from GitHub with install.sh and flai
# self-upgrade. No story's close-out runs this check: the smoke tier installs
# from a release built from the tree. A failure here fails the run, which is
# the record; the script opens or bumps an issue only when run on a host.

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-published:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: flai/go.mod
      - name: Build flai
        run: go build -o /usr/local/bin/flai .
        working-directory: flai
      - name: Install the latest published release
        run: scripts/install-published-test.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
