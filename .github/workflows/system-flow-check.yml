name: system-flow check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint markdown
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: |
            **/*.md
            !**/node_modules/**
            !**/testdata/**
            !bin/**
            !flaiover/build/**
            !**/.svelte-kit/**
      - uses: actions/setup-go@v7
        with:
          go-version-file: flai/go.mod
      - name: Build flai
        run: go build -o /usr/local/bin/flai .
        working-directory: flai
      - name: Smoke tests
        run: scripts/smoke.sh
