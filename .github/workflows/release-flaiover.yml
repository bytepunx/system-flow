name: release flaiover

on:
  push:
    tags: ["flaiover/v*"]
    branches: [main]
    paths: ["flaiover/**", "flai/**", ".github/workflows/release-flaiover.yml"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/bytepunx/flaiover
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=match,pattern=flaiover/v(\d+\.\d+\.\d+),group=1
            type=match,pattern=flaiover/v(\d+)\.\d+\.\d+,group=1
            type=sha,prefix=sha-
      - name: flai version for the bundled binary
        id: flai
        run: |
          echo "version=$(git describe --tags --match 'flai/v*' --abbrev=0 | sed 's|flai/v||')" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "flaiover=$(git describe --tags --match 'flaiover/v*' --abbrev=0 2>/dev/null | sed 's|flaiover/v||' || echo 0.0.0)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: flaiover/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            FLAI_VERSION=${{ steps.flai.outputs.version }}
            FLAI_COMMIT=${{ steps.flai.outputs.commit }}
            FLAI_DATE=${{ steps.flai.outputs.date }}
            FLAIOVER_VERSION=${{ steps.flai.outputs.flaiover }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
