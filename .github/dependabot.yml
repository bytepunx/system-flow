version: 2
updates:
  - package-ecosystem: gomod
    directory: /flai
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /flaiover
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directories:
      - /flaiover
      - /flai/images/bedrock
      - /flai/images/system-flow
    schedule:
      interval: weekly
