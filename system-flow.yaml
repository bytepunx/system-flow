version: 1
name: system-flow
key: sf
description: Agentic lean project management system
owner: alex
repo: https://github.com/bytepunx/system-flow
template:
  repo: ./template
  ref: ""
  version: "1.0.0"
  applied: 2026-09-17T03:24:52Z
layout:
  design: design
  docs: docs
  wip: wip
projects:
  - name: flai
    path: flai
    kind: go
    tags: [cli]
  - name: flaiover
    path: flaiover
    kind: sveltekit
    tags: [dashboard]
    components:
      exclude: [src/lib/components/AgentStream.svelte, src/lib/components/DocEditor.svelte, src/lib/components/EditorDialog.svelte, src/lib/components/HostAgentNotice.svelte, src/lib/components/HostFlai.svelte, src/lib/components/HostFlaiBanner.svelte, src/lib/components/HostPanel.svelte, src/lib/components/HostProcesses.svelte, src/lib/components/InboxBadge.svelte, src/lib/components/ItemEditor.svelte, src/lib/components/OpenQuestions.svelte, src/lib/components/PlanAction.svelte, src/lib/components/Review.svelte, src/lib/components/SettingsPanel.svelte, src/lib/components/StoryAgent.svelte, src/lib/components/UnsignedBanner.svelte]
      setup: src/routes/layout.css
  - name: template
    path: template
    kind: template
    tags: [template, conventions]
dashboard:
  image: ghcr.io/bytepunx/flaiover
  tag: latest
  port: 4242
agent:
  harness: claude-code
  model: claude-opus-5-5
  config:
    effort: high
planning:
  hour_rate: 150
claims:
  shared:
    - docs/users/flai.md
    - docs/users/flai-reference.md
    - design/system/flai-cli.md
    - design/adrs
    - design/issues
    - template/CHANGELOG.md
flai:
  minimum: 1.48.0
tests:
  - name: gofmt
    command: [gofmt, "-l", "{files}"]
    dir: flai
    paths: ["flai/**/*.go"]
    format: gofmt-list
  - name: vet
    command: [go, vet, "{importers}"]
    dir: flai
    paths: ["flai/**/*.go", "flai/**/testdata/**"]
    format: plain
  - name: golangci-lint
    command: ["../scripts/with-env.sh", golangci-lint, run, "--allow-parallel-runners", "--show-stats=false", "--output.json.path", stdout, "{packages}"]
    dir: flai
    paths: ["flai/**/*.go", "flai/**/testdata/**"]
    format: golangci-json
  - name: go-test
    command: [go, test, "-json", "-race", "-short", "-count=1", "{packages}"]
    dir: flai
    paths: ["flai/**/*.go", "flai/**/testdata/**"]
    format: go-test-json
  - name: flaiover-lint
    command: ["../scripts/flaiover-lint.sh", "{files}"]
    dir: flaiover
    paths: ["flaiover/**", "!flaiover/node_modules/**", "!flaiover/build/**", "!flaiover/.svelte-kit/**"]
    format: plain
  - name: vitest
    command: ["../scripts/flaiover-unit.sh", related, "--run", "--reporter=json", "{files}"]
    dir: flaiover
    paths: ["flaiover/src/**", "flaiover/*.ts", "flaiover/*.js"]
    format: vitest-json
    all_command: ["../scripts/flaiover-unit.sh", run, "--reporter=json"]
  - name: markdown
    command: [scripts/lint-md.sh, "{files}"]
    paths: ["**/*.md", "!**/node_modules/**", "!**/testdata/**", "!bin/**", "!flaiover/build/**", "!**/.svelte-kit/**", "!.flai-cache/**"]
    format: plain
    all_command: [scripts/lint-md.sh]
    fix_command: [scripts/lint-md.sh, --fix, "{files}"]
  - name: template
    command: [scripts/template-test.sh]
    paths: ["template/**"]
    format: plain
    all_only: true
  - name: flaiover
    command: [scripts/flaiover-test.sh]
    paths: ["flaiover/**", "!flaiover/node_modules/**", "!flaiover/build/**", "!flaiover/.svelte-kit/**"]
    format: plain
    all_only: true
    covers: [flaiover-lint, vitest]
  - name: integration
    command: ["../scripts/integration.sh", "-json"]
    dir: flai
    paths: ["flai/**"]
    format: go-test-json
    all_only: true
    covers: [go-test]
  - name: smoke
    command: [scripts/smoke.sh]
    paths: ["flai/**"]
    format: plain
    all_only: true
orchestration:
  permissions:
    accept_reviews: true
    answer_threads: autonomous
    finalize_drafts: true
    order_ready: true
    plan_backlog_epics: true
    promote_to_ready: true
    publish: true
    plan_backlog_stories: true
  policy: throughput
  release:
    value: 1000
analysis:
  agent:
    harness: claude-code
    model: claude-fable-5-1
    config:
      effort: medium
