version: 1
name: system-flow
key: sf
description: Agentic lean project management system
owner: alex
repo: https://github.com/bytepunx/system-flow
template:
  repo: ./template
  ref: ""
  version: "1.0.0"
  applied: 2026-09-17T03:24:52Z
layout:
  design: design
  docs: docs
  wip: wip
projects:
  - name: flai
    path: flai
    kind: go
    tags: [cli]
  - name: flaiover
    path: flaiover
    kind: sveltekit
    tags: [dashboard]
  - name: template
    path: template
    kind: template
    tags: [template, conventions]
dashboard:
  image: ghcr.io/bytepunx/flaiover
  tag: latest
  port: 4242
agent:
  harness: claude-code
  model: claude-opus-5-5
  config:
    effort: high
planning:
  hour_rate: 150
claims:
  shared:
    - docs/users/flai.md
    - docs/users/flai-reference.md
    - design/system/flai-cli.md
    - design/adrs
    - design/issues
    - template/CHANGELOG.md
flai:
  minimum: 1.31.0
